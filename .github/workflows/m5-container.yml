name: M8 synthetic container verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify checkout and Docker runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker version
          docker compose version
      - name: Install local fixture tooling
        run: python -m pip install -c constraints/m5.txt -e '.[dev,m5-service]'
      - name: Build and verify synthetic container
        run: python scripts/verify_m5_container.py --runtime
