name: M5 container verification
on:
  workflow_dispatch:
jobs:
  synthetic-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local fixture tooling
        run: python -m pip install -c constraints/m5.txt -e '.[dev,m5-service]'
      - name: Validate synthetic bundle and container
        run: python scripts/verify_m5_container.py --runtime
