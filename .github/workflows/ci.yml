name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -c constraints/m5.txt -e '.[dev,m5-service]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests scripts
      - name: Research and portfolio integrity
        run: |
          python scripts/verify_m6.py
          python scripts/verify_m7.py
      - name: Static container checks
        run: python scripts/verify_m5_container.py
      - name: Smoke experiment
        run: trusttabx --train-size 300 --selection-size 100 --calibration-size 100 --test-size 120
