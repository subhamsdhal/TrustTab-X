[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trusttabx"
version = "0.1.0"
description = "Research-first benchmarking for trustworthy tabular predictions under distribution shift"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TrustTab-X contributors"}]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
benchmarks = ["openml>=0.14", "pandas>=2", "xgboost>=2", "catboost>=1.2"]
research-tabpfn = ["tabpfn>=2"] # Verify the installed model-weight license and compute requirements.

[project.scripts]
trusttabx = "trusttabx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
