services:
  trusttabx:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRUSTTABX_MODEL_DIR: /models
      TRUSTTABX_TRUST_LOCAL_ARTIFACT: "1"
    volumes:
      - ./outputs/m5_acs_model:/models:ro
    mem_limit: 2g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:size=64m
